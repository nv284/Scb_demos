<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Banking Dashboard with Login</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; }
    #dashboard { display: none; margin-top: 20px; }
    #transactions { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
  </style>
</head>
<body>

  <h2>🔐 Login to Your Bank Account</h2>

  <div id="login">
    <label for="username">Username:</label>
    <input type="text" id="username" placeholder="Enter username">

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password">

    <button onclick="login()">Login</button>
    <p id="loginError" style="color: red;"></p>
  </div>

  <!-- Banking Dashboard -->
  <div id="dashboard">
    <h2> Welcome, <span id="userDisplay"></span>!</h2>

    <label for="amount">Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <button onclick="deposit()">Deposit</button>
    <button onclick="withdraw()">Withdraw</button>

    <h3> Current Balance: $<span id="balance">0.00</span></h3>

    <div id="transactions">
      <h4> Transaction History:</h4>
      <ul id="transactionList"></ul>
    </div>
  </div>

  <script src="script1.js"></script>
</body>
</html>
