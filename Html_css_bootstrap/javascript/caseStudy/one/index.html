<!--Build a web application that allows a user to enter:
Principal amount
Interest rate
Time (in years)
Compound frequency (optional)
The app will calculate and display:
Simple Interest
Compound Interest-->
<!DOCTYPE html>
<html>
    <head>
        <title>calculate intreste </title>
       <style>
    body { font-family: Arial, padding: 20px; max-width: 500px; margin: auto; }
    input, button, select { width: 100%; padding: 10px; margin: 10px 0; }
    label { font-weight: bold; }
  </style>
    </head>
    <body>
        <body>

  <h2> Interest Calculator</h2>

  <label for="principal">Principal Amount ($):</label>
  <input type="text" id="principal" placeholder="Enter principal">

  <label for="rate">Interest Rate (% per year):</label>
  <input type="number" id="rate" placeholder="Enter annual rate">

  <label for="time">Time (in years):</label>
  <input type="number" id="time" placeholder="Enter number of years">

  <label for="frequency">Compound Frequency (per year):</label>
  <select id="frequency">
    <option value="1">Annually</option>
    <option value="2">Semi-Annually</option>
    <option value="4">Quarterly</option>
    <option value="12">Monthly</option>
  </select>

  <button onclick="calculateInterest()">Calculate</button>

  <div id="output"></div>
<!--javascript integration -->
  <script src="script.js"></script>
    </body>
</html>
