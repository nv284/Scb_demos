<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h2> Array Example </h2>
        <script>
            var car = new Array["HindaCity" , "KIA" , "Maruti"];
            for(i=0;i<car.length; i++ ){
                document.write(car[i]);
            }
            document.write("<p> reverse order:<b>"+car.reverse()+"</p");
        </script>


    </body>
</html>
