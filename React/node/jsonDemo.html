<!DOCTYPE html>
<html>
    <head>
        <title>Json Demo</title>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
<div class="container">
    <h2 class="mb-4">User Form </h2>
    <form id="userForm" class="mb-4">
        <div>
            <label for="name" class="form-label">Name:</label>
            <input type="text" id="name" class="form-control" required>
        </div>
         <div>
            <label for="email" class="form-label">email:</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="button" id="displaybtn" class="btn btn-primary">Display Json Data</button>
    </form>

    <h4>JSON Output:</h4>
    <pre id="jsonOutput" class="bg-light p-3 border rounded "></pre>
</div>
<script >
const entries =[];
const form = document.getElementById('userForm');
const displayBtn = document.getElementById('displaybtn');
const jsonOutput = document.getElementById('jsonOutput');

form.addEventListener('submit' , function(e){
    e.preventDefault();
    const name= document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    if(name && email){
        entries.push({name,email});
        form.reset();
        alert('Entry save!d')
    }else{
        alert('Please fill out all fields ');
    }
});
displayBtn.addEventListener('click',function(){
    jsonOutput.textContent=JSON.stringify(entries,null,2);
});

</script>
    </body>
</html>
